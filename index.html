<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sicilia" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Sicilia — Guide Audio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sienna:    #c0622a;
      --terra:     #8b3e1a;
      --gold:      #d4a84b;
      --cream:     #f5eedf;
      --sand:      #e8d9c0;
      --dusk:      #1a1410;
      --olive:     #6b7c4a;
      --sea:       #2c6e8a;
      --radius:    16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      background: var(--dusk);
      font-family: 'Inter', sans-serif;
      color: var(--cream);
      overflow: hidden;
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(192,98,42,.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 100% 100%, rgba(44,110,138,.2) 0%, transparent 60%),
        linear-gradient(170deg, #1a1410 0%, #0d0a07 60%, #111820 100%);
    }
    .bg::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c0622a' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: .4;
    }

    /* ── LAYOUT ── */
    .app {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      gap: 12px;
    }

    /* ── HEADER ── */
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding-top: 8px;
    }
    .wordmark {
      font-family: 'Cinzel', serif;
      font-size: 22px; font-weight: 600;
      letter-spacing: .12em;
      color: var(--gold);
      line-height: 1;
    }
    .wordmark span { display: block; font-size: 10px; font-weight: 400; letter-spacing: .25em; color: var(--sienna); margin-top: 3px; }

    .gps-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 11px; color: rgba(245,238,223,.6);
      cursor: pointer;
      transition: background .2s;
    }
    .gps-pill:hover { background: rgba(255,255,255,.1); }
    .gps-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #666; flex-shrink: 0;
      transition: background .4s;
    }
    .gps-dot.active { background: #4caf50; box-shadow: 0 0 6px #4caf5088; animation: pulse 2s infinite; }
    .gps-dot.error  { background: var(--sienna); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── NOW PLAYING CARD ── */
    .now-playing {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(212,168,75,.2);
      border-radius: var(--radius);
      padding: 20px;
      flex-shrink: 0;
    }
    .np-label {
      font-family: 'Cinzel', serif;
      font-size: 9px; letter-spacing: .3em;
      color: var(--gold); opacity: .7;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .np-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 300; font-style: italic;
      color: var(--cream); line-height: 1.2;
      margin-bottom: 6px;
    }
    .np-subtitle {
      font-size: 12px; color: rgba(245,238,223,.45);
      letter-spacing: .05em;
    }

    /* waveform */
    .waveform {
      display: flex; align-items: center; gap: 3px;
      height: 36px; margin: 14px 0 12px;
    }
    .waveform-bar {
      flex: 1; border-radius: 2px;
      background: var(--gold); opacity: .3;
      animation: none;
      height: 4px;
      transition: height .15s, opacity .15s;
    }
    .waveform.playing .waveform-bar {
      opacity: .65;
      animation: wave 1.2s ease-in-out infinite;
    }
    @keyframes wave {
      0%,100% { height: 4px }
      50%      { height: var(--h, 20px) }
    }
    .waveform.playing .waveform-bar:nth-child(1)  { --h:10px; animation-delay: 0s }
    .waveform.playing .waveform-bar:nth-child(2)  { --h:22px; animation-delay:.1s }
    .waveform.playing .waveform-bar:nth-child(3)  { --h:18px; animation-delay:.2s }
    .waveform.playing .waveform-bar:nth-child(4)  { --h:28px; animation-delay:.05s }
    .waveform.playing .waveform-bar:nth-child(5)  { --h:14px; animation-delay:.15s }
    .waveform.playing .waveform-bar:nth-child(6)  { --h:24px; animation-delay:.3s }
    .waveform.playing .waveform-bar:nth-child(7)  { --h:20px; animation-delay:.08s }
    .waveform.playing .waveform-bar:nth-child(8)  { --h:30px; animation-delay:.22s }
    .waveform.playing .waveform-bar:nth-child(9)  { --h:16px; animation-delay:.18s }
    .waveform.playing .waveform-bar:nth-child(10) { --h:12px; animation-delay:.35s }
    .waveform.playing .waveform-bar:nth-child(11) { --h:26px; animation-delay:.12s }
    .waveform.playing .waveform-bar:nth-child(12) { --h:8px;  animation-delay:.28s }

    /* transport */
    .transport {
      display: flex; align-items: center; justify-content: space-between;
    }
    .btn-play {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--sienna), var(--terra));
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(192,98,42,.4);
      transition: transform .15s, box-shadow .15s;
      color: var(--cream);
      font-size: 20px;
    }
    .btn-play:active { transform: scale(.93); box-shadow: 0 2px 10px rgba(192,98,42,.3); }

    .btn-icon {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--cream); font-size: 16px;
      transition: background .15s;
    }
    .btn-icon:hover { background: rgba(255,255,255,.13); }

    .speed-btn {
      font-family: 'Inter', sans-serif;
      font-size: 12px; font-weight: 300; letter-spacing: .05em;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer; color: var(--cream);
      transition: background .15s;
    }
    .speed-btn:hover { background: rgba(255,255,255,.13); }

    /* ── SCRIPT TEXT ── */
    .script-box {
      flex: 0 0 180px; overflow-y: auto;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--radius);
      padding: 18px;
      -webkit-overflow-scrolling: touch;
    }
    .script-box::-webkit-scrollbar { display: none; }
    .script-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px; line-height: 1.75;
      font-weight: 300; color: rgba(245,238,223,.8);
    }
    .script-text .highlight {
      color: var(--gold);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(212,168,75,.35);
    }
    .script-empty {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px; font-style: italic;
      color: rgba(245,238,223,.25);
      text-align: center; padding: 30px 0;
    }

    /* ── QUEUE ── */
    .queue-section { flex-shrink: 0; }
    .queue-label {
      font-family: 'Cinzel', serif;
      font-size: 9px; letter-spacing: .3em;
      color: rgba(212,168,75,.6);
      margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .queue-scroll {
      display: flex; gap: 10px;
      overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .queue-scroll::-webkit-scrollbar { display: none; }
    .queue-item {
      flex-shrink: 0;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 140px; max-width: 180px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .queue-item:hover, .queue-item.active {
      background: rgba(192,98,42,.15);
      border-color: rgba(212,168,75,.3);
    }
    .queue-item-trigger {
      font-size: 9px; letter-spacing: .1em;
      color: var(--sienna); margin-bottom: 4px;
      text-transform: uppercase;
    }
    .queue-item-trigger.idle { color: var(--olive); }
    .queue-item-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px; font-weight: 400;
      color: var(--cream); line-height: 1.3;
    }

    /* ── TTS STATUS BAR ── */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: rgba(245,238,223,.35);
      padding: 0 2px;
      flex-shrink: 0;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status-bar.loading { color: var(--gold); }
    .status-bar.ready   { color: var(--olive); }
    .status-bar.error   { color: var(--sienna); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(26,20,16,.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(212,168,75,.2);
      border-radius: 20px; padding: 10px 20px;
      font-size: 13px; color: var(--cream);
      opacity: 0; transition: opacity .3s, transform .3s;
      pointer-events: none; white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── MODAL (script editor) ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      width: 100%; background: #1e1810;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(212,168,75,.2);
      padding: 24px 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
      transform: translateY(100%); transition: transform .3s;
      max-height: 85dvh; overflow-y: auto;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,.2);
      margin: 0 auto 20px;
    }
    .modal h2 {
      font-family: 'Cinzel', serif; font-size: 14px;
      letter-spacing: .15em; color: var(--gold); margin-bottom: 16px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 10px; letter-spacing: .15em;
      color: rgba(245,238,223,.45); text-transform: uppercase; margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: 10px 14px;
      color: var(--cream); font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none;
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-save {
      width: 100%; background: linear-gradient(135deg, var(--sienna), var(--terra));
      border: none; border-radius: 12px; padding: 14px;
      color: var(--cream); font-family: 'Cinzel', serif;
      font-size: 13px; letter-spacing: .1em; cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="bg"></div>

<div class="app" id="app">

  <!-- HEADER -->
  <header>
    <div class="wordmark">SICILIA<span>GUIDE AUDIO</span></div>
    <div class="gps-pill" onclick="toggleGPS()">
      <div class="gps-dot" id="gpsDot"></div>
      <span id="gpsLabel">GPS off</span>
    </div>
  </header>

  <!-- NOW PLAYING -->
  <div class="now-playing">
    <div class="np-label">En cours</div>
    <div class="np-title" id="npTitle">Sélectionner un script</div>
    <div class="np-subtitle" id="npSubtitle">Démarrez le GPS ou choisissez manuellement</div>

    <div class="waveform" id="waveform">
      <div class="waveform-bar"></div><div class="waveform-bar"></div>
      <div class="waveform-bar"></div><div class="waveform-bar"></div>
      <div class="waveform-bar"></div><div class="waveform-bar"></div>
      <div class="waveform-bar"></div><div class="waveform-bar"></div>
      <div class="waveform-bar"></div><div class="waveform-bar"></div>
      <div class="waveform-bar"></div><div class="waveform-bar"></div>
    </div>

    <div class="transport">
      <button class="btn-icon" onclick="skipBack()" title="Rembobiner">↩</button>
      <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶</button>
      <button class="btn-icon" onclick="skipNext()" title="Suivant">↪</button>
      <button class="speed-btn" onclick="cycleSpeed()" id="speedBtn">1×</button>
    </div>
  </div>

  <!-- SCRIPT TEXT -->
  <div class="script-box">
    <div class="script-text" id="scriptText">
      <div class="script-empty">Le texte du script apparaîtra ici pendant la lecture…</div>
    </div>
  </div>

  <!-- QUEUE -->
  <div class="queue-section">
    <div class="queue-label">
      <span>SCRIPTS</span>
      <span style="cursor:pointer;color:var(--sienna)" onclick="openAddModal()">+ Ajouter</span>
    </div>
    <div class="queue-scroll" id="queueScroll"></div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="statusText">Initialisation du moteur TTS…</span>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL ADD SCRIPT -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>NOUVEAU SCRIPT</h2>
    <div class="form-group">
      <label>Titre</label>
      <input type="text" id="fTitle" placeholder="ex: Vallée des Temples" />
    </div>
    <div class="form-group">
      <label>Type de déclencheur</label>
      <select id="fTriggerType" onchange="updateTriggerFields()">
        <option value="gps">GPS — proximité</option>
        <option value="idle">Temps mort</option>
        <option value="manual">Manuel</option>
      </select>
    </div>
    <div id="gpsFields">
      <div class="form-row">
        <div class="form-group"><label>Latitude</label><input type="number" id="fLat" step="0.0001" placeholder="37.5079" /></div>
        <div class="form-group"><label>Longitude</label><input type="number" id="fLng" step="0.0001" placeholder="14.0154" /></div>
      </div>
      <div class="form-group"><label>Rayon (mètres)</label><input type="number" id="fRadius" value="200" /></div>
    </div>
    <div id="idleFields" style="display:none">
      <div class="form-group"><label>Silence minimum (secondes)</label><input type="number" id="fIdle" value="120" /></div>
    </div>
    <div class="form-group">
      <label>Texte / Script</label>
      <textarea id="fScript" placeholder="Entrez le texte que le guide lira à voix haute…"></textarea>
    </div>
    <button class="btn-save" onclick="saveScript()">Enregistrer</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DATA — scripts exemples Sicile
// ═══════════════════════════════════════════════════════
let scripts = JSON.parse(localStorage.getItem('sicilia_scripts') || 'null') || [
  {
    id: 's1', title: 'Vallée des Temples',
    trigger: { type: 'gps', lat: 37.2909, lng: 13.5881, radius: 300 },
    priority: 1, played: false,
    script: "Devant vous s'élèvent les temples doriques de la Vallée des Temples, inscrits au patrimoine mondial de l'UNESCO. Construits entre le sixième et le cinquième siècle avant notre ère, ils sont parmi les exemples les mieux conservés de l'architecture grecque antique. Le Temple de la Concorde, encore presque intact, fut transformé en église chrétienne au septième siècle — ce qui explique sa remarquable préservation."
  },
  {
    id: 's2', title: 'Palermo — Palais des Normands',
    trigger: { type: 'gps', lat: 38.1121, lng: 13.3520, radius: 250 },
    priority: 1, played: false,
    script: "Bienvenue au Palais des Normands, ou Palazzo Reale. Construit sur une forteresse punique, puis arabe, ce palais fut la résidence des rois normands de Sicile au douzième siècle. La Chapelle Palatine, nichée en son cœur, est un chef-d'œuvre absolu de l'art normand-arabe-byzantin : ses mosaïques dorées racontent l'histoire sacrée avec une précision et une beauté à couper le souffle."
  },
  {
    id: 's3', title: 'Mont Etna — Approche',
    trigger: { type: 'gps', lat: 37.7510, lng: 14.9934, radius: 5000 },
    priority: 2, played: false,
    script: "Vous approchez de l'Etna — le plus grand volcan actif d'Europe, et l'un des plus actifs au monde. Avec ses trois mille trois cent vingt-neuf mètres d'altitude, il domine toute la Sicile orientale. Les Siciliens l'appellent simplement Mongibello, la belle montagne. La lave qui s'en écoule, riche en minéraux, a créé l'un des sols agricoles les plus fertiles de la Méditerranée — vignes, pistachiers et orangers y prospèrent à ses pieds."
  },
  {
    id: 's4', title: 'Anecdote — La cuisine sicilienne',
    trigger: { type: 'idle', min_silence_sec: 90 },
    priority: 3, played: false,
    script: "Pendant que vous roulez, une parenthèse gourmande. La cuisine sicilienne est un récit de toutes les civilisations qui ont occupé l'île. Les Arabes ont introduit le couscous, les amandes, les agrumes et la canne à sucre. Les Normands ont apporté la tradition du gibier. Les Espagnols, le chocolat et la tomate. Résultat : une cuisine unique au monde, où les arancini côtoient le caponata, et où la granita au café remplace le petit-déjeuner continental."
  },
  {
    id: 's5', title: 'Taormine — Théâtre grec',
    trigger: { type: 'gps', lat: 37.8524, lng: 15.2900, radius: 200 },
    priority: 1, played: false,
    script: "Le Théâtre Antique de Taormine offre l'une des vues les plus spectaculaires du monde. Construit par les Grecs au troisième siècle avant notre ère, puis considérablement remanié par les Romains, il pouvait accueillir jusqu'à cinq mille spectateurs. Depuis les gradins, par temps clair, vous distinguez l'Etna enneigé d'un côté, et la mer Ionienne de l'autre. Un décor que les dieux eux-mêmes auraient envié."
  }
];

function saveScripts() { localStorage.setItem('sicilia_scripts', JSON.stringify(scripts)); }

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let currentScript = null;
let isPlaying = false;
let gpsActive = false;
let gpsWatchId = null;
let currentPos = null;
let idleTimer = null;
let idleSeconds = 0;
let ttsReady = false;
let ttsLoading = false;
let currentUtterance = null;
let speechSpeed = 1;
const speeds = [0.8, 1, 1.1, 1.25];
let speedIndex = 1;
let currentWordIndex = 0;
let wordSpans = [];

// ═══════════════════════════════════════════════════════
//  TTS — Kokoro via transformers.js (lazy load)
// ═══════════════════════════════════════════════════════
let pipeline = null;
let audioCtx = null;

async function initTTS() {
  if (ttsLoading || ttsReady) return;
  ttsLoading = true;
  setStatus('loading', 'Chargement du modèle Kokoro…');

  try {
    const { pipeline: pipelineFn, env } = await import(
      'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1/dist/transformers.min.js'
    );
    env.allowLocalModels = false;
    env.backends.onnx.wasm.wasmPaths =
      'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/';

    setStatus('loading', 'Téléchargement Kokoro (première fois : ~80 Mo)…');
    pipeline = await pipelineFn('text-to-speech', 'onnx-community/Kokoro-82M-v1.0', {
      dtype: 'fp32',
      device: 'wasm'
    });
    ttsReady = true;
    ttsLoading = false;
    setStatus('ready', 'Kokoro prêt — voix naturelle activée');
    showToast('🎙 Kokoro TTS chargé');
  } catch (err) {
    console.error('Kokoro failed, falling back to Web Speech API', err);
    ttsLoading = false;
    ttsReady = 'fallback';
    setStatus('ready', 'Mode Web Speech (Kokoro indisponible)');
  }
}

async function speakText(text) {
  if (!ttsReady) { await initTTS(); }

  stopSpeech();
  renderScriptWithHighlight(text);
  setWaveform(true);

  if (ttsReady === true && pipeline) {
    await speakKokoro(text);
  } else {
    speakFallback(text);
  }
}

async function speakKokoro(text) {
  try {
    const result = await pipeline(text, { voice: 'fr_siwis' });
    // result = { audio: Float32Array, sampling_rate: number }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const buf = audioCtx.createBuffer(1, result.audio.length, result.sampling_rate);
    buf.copyToChannel(result.audio, 0);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = speechSpeed;
    src.connect(audioCtx.destination);
    src.onended = () => { setWaveform(false); isPlaying = false; updatePlayBtn(); onScriptEnded(); };
    currentUtterance = src;
    src.start();
  } catch(e) {
    console.warn('Kokoro speak error', e);
    speakFallback(text);
  }
}

function speakFallback(text) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR'; utter.rate = speechSpeed;
  utter.onboundary = (e) => { if (e.name === 'word') highlightWord(e.charIndex, text); };
  utter.onend = () => { setWaveform(false); isPlaying = false; updatePlayBtn(); onScriptEnded(); };
  currentUtterance = utter;
  speechSynthesis.speak(utter);
}

function stopSpeech() {
  speechSynthesis.cancel();
  if (currentUtterance && currentUtterance.stop) {
    try { currentUtterance.stop(); } catch(e) {}
  }
  currentUtterance = null;
  setWaveform(false);
}

// ═══════════════════════════════════════════════════════
//  SCRIPT TEXT HIGHLIGHTING
// ═══════════════════════════════════════════════════════
function renderScriptWithHighlight(text) {
  const words = text.split(/(\s+)/);
  wordSpans = [];
  const container = document.getElementById('scriptText');
  container.innerHTML = '';
  words.forEach((tok, i) => {
    if (/\S/.test(tok)) {
      const span = document.createElement('span');
      span.textContent = tok;
      span.dataset.idx = wordSpans.length;
      wordSpans.push(span);
      container.appendChild(span);
    } else {
      container.appendChild(document.createTextNode(tok));
    }
  });
}

function highlightWord(charIndex, fullText) {
  // find word index from char index
  let count = 0, wIdx = 0;
  const words = fullText.split(/\s+/);
  for (let i = 0; i < words.length; i++) {
    count += words[i].length + 1;
    if (count > charIndex) { wIdx = i; break; }
  }
  wordSpans.forEach((s, i) => {
    s.classList.toggle('highlight', i === wIdx);
  });
}

// ═══════════════════════════════════════════════════════
//  PLAYBACK CONTROL
// ═══════════════════════════════════════════════════════
function selectScript(id) {
  const s = scripts.find(x => x.id === id);
  if (!s) return;
  currentScript = s;
  document.getElementById('npTitle').textContent = s.title;
  document.getElementById('npSubtitle').textContent =
    s.trigger.type === 'gps' ? `GPS · rayon ${s.trigger.radius}m` :
    s.trigger.type === 'idle' ? `Temps mort · ${s.trigger.min_silence_sec}s` : 'Manuel';
  renderScriptWithHighlight(s.script);
  renderQueue();
  if (isPlaying) { stopSpeech(); isPlaying = false; updatePlayBtn(); }
}

function togglePlay() {
  if (!currentScript) { showToast('Sélectionnez un script d'abord'); return; }
  if (isPlaying) {
    pauseSpeech();
  } else {
    startSpeech();
  }
}

function startSpeech() {
  if (!currentScript) return;
  initTTS(); // start loading if needed
  isPlaying = true; updatePlayBtn();
  currentScript.played = true; saveScripts();
  speakText(currentScript.script);
  resetIdleTimer();
}

function pauseSpeech() {
  if (ttsReady === true) {
    if (currentUtterance && currentUtterance.stop) {
      try { currentUtterance.stop(); } catch(e) {}
    }
  } else {
    speechSynthesis.pause();
  }
  isPlaying = false; updatePlayBtn(); setWaveform(false);
}

function skipBack() {
  stopSpeech(); isPlaying = false; updatePlayBtn();
  if (currentScript) renderScriptWithHighlight(currentScript.script);
  showToast('Rembobiné');
}

function skipNext() {
  stopSpeech();
  const unplayed = scripts.filter(s => !s.played && s.id !== currentScript?.id);
  if (unplayed.length) { selectScript(unplayed[0].id); showToast(`→ ${unplayed[0].title}`); }
  else { showToast('Fin de la file'); }
}

function onScriptEnded() {
  isPlaying = false; updatePlayBtn();
  if (currentScript) { currentScript.played = true; saveScripts(); }
  renderQueue();
  resetIdleTimer();
}

function updatePlayBtn() {
  document.getElementById('btnPlay').textContent = isPlaying ? '⏸' : '▶';
  document.getElementById('waveform').classList.toggle('playing', isPlaying);
}

function cycleSpeed() {
  speedIndex = (speedIndex + 1) % speeds.length;
  speechSpeed = speeds[speedIndex];
  document.getElementById('speedBtn').textContent = speechSpeed + '×';
  showToast(`Vitesse : ${speechSpeed}×`);
}

// ═══════════════════════════════════════════════════════
//  GPS
// ═══════════════════════════════════════════════════════
function toggleGPS() {
  if (gpsActive) stopGPS(); else startGPS();
}

function startGPS() {
  if (!navigator.geolocation) { showToast('GPS non disponible'); return; }
  gpsActive = true;
  document.getElementById('gpsDot').className = 'gps-dot active';
  document.getElementById('gpsLabel').textContent = 'GPS actif';
  gpsWatchId = navigator.geolocation.watchPosition(onPosition, onGPSError, {
    enableHighAccuracy: true, maximumAge: 5000, timeout: 15000
  });
  resetIdleTimer();
  initTTS();
}

function stopGPS() {
  gpsActive = false;
  if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
  clearInterval(idleTimer);
  document.getElementById('gpsDot').className = 'gps-dot';
  document.getElementById('gpsLabel').textContent = 'GPS off';
}

function onPosition(pos) {
  currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
  const acc = Math.round(pos.coords.accuracy);
  document.getElementById('gpsLabel').textContent = `±${acc}m`;
  checkGPSTriggers();
}

function onGPSError(err) {
  document.getElementById('gpsDot').className = 'gps-dot error';
  document.getElementById('gpsLabel').textContent = 'Erreur GPS';
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function checkGPSTriggers() {
  if (!currentPos || isPlaying) return;
  const nearby = scripts
    .filter(s => s.trigger.type === 'gps' && !s.played)
    .filter(s => haversine(currentPos.lat, currentPos.lng, s.trigger.lat, s.trigger.lng) <= s.trigger.radius)
    .sort((a, b) => a.priority - b.priority);
  if (nearby.length) {
    selectScript(nearby[0].id);
    showToast(`📍 ${nearby[0].title}`);
    startSpeech();
  }
}

// ═══════════════════════════════════════════════════════
//  IDLE TIMER
// ═══════════════════════════════════════════════════════
function resetIdleTimer() {
  clearInterval(idleTimer); idleSeconds = 0;
  idleTimer = setInterval(() => {
    if (isPlaying) { idleSeconds = 0; return; }
    idleSeconds++;
    const idleScripts = scripts.filter(s => s.trigger.type === 'idle' && !s.played);
    if (idleScripts.length) {
      const trigger = idleScripts.find(s => idleSeconds >= s.trigger.min_silence_sec);
      if (trigger) {
        selectScript(trigger.id);
        showToast(`🕐 Contenu de remplissage`);
        startSpeech();
      }
    }
  }, 1000);
}

// ═══════════════════════════════════════════════════════
//  QUEUE RENDER
// ═══════════════════════════════════════════════════════
function renderQueue() {
  const el = document.getElementById('queueScroll');
  el.innerHTML = '';
  scripts.forEach(s => {
    const div = document.createElement('div');
    div.className = 'queue-item' + (currentScript?.id === s.id ? ' active' : '');
    if (s.played) div.style.opacity = '.45';
    const tLabel = s.trigger.type === 'gps' ? '📍 GPS' : s.trigger.type === 'idle' ? '🕐 Temps mort' : '👆 Manuel';
    div.innerHTML = `<div class="queue-item-trigger ${s.trigger.type}">${tLabel}</div>
      <div class="queue-item-name">${s.title}</div>`;
    div.onclick = () => { selectScript(s.id); };
    el.appendChild(div);
  });
}

// ═══════════════════════════════════════════════════════
//  MODAL — ADD SCRIPT
// ═══════════════════════════════════════════════════════
function openAddModal() {
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function closeModalOnBg(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
function updateTriggerFields() {
  const t = document.getElementById('fTriggerType').value;
  document.getElementById('gpsFields').style.display = t === 'gps' ? '' : 'none';
  document.getElementById('idleFields').style.display = t === 'idle' ? '' : 'none';
}
function saveScript() {
  const title = document.getElementById('fTitle').value.trim();
  const script = document.getElementById('fScript').value.trim();
  const type = document.getElementById('fTriggerType').value;
  if (!title || !script) { showToast('Titre et script requis'); return; }
  const newS = {
    id: 's' + Date.now(), title, script, played: false, priority: 3,
    trigger: type === 'gps' ? {
      type: 'gps',
      lat: parseFloat(document.getElementById('fLat').value),
      lng: parseFloat(document.getElementById('fLng').value),
      radius: parseInt(document.getElementById('fRadius').value) || 200
    } : type === 'idle' ? {
      type: 'idle',
      min_silence_sec: parseInt(document.getElementById('fIdle').value) || 120
    } : { type: 'manual' }
  };
  scripts.push(newS);
  saveScripts();
  renderQueue();
  closeModal();
  showToast('Script ajouté');
  document.getElementById('fTitle').value = '';
  document.getElementById('fScript').value = '';
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function setStatus(state, text) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar ' + state;
  document.getElementById('statusText').textContent = text;
}

function setWaveform(on) {
  document.getElementById('waveform').classList.toggle('playing', on);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderQueue();
  setStatus('', 'Appuyez sur GPS pour démarrer, ou sélectionnez un script');
  // Preload TTS on first user interaction to satisfy Safari autoplay policy
  document.addEventListener('touchstart', () => { if (!ttsReady && !ttsLoading) initTTS(); }, { once: true });
});

// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e));
}
</script>
