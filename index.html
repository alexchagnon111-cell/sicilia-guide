<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sicilia" />
  <link rel="manifest" href="manifest.json" />
  <title>Sicilia — Guide Audio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sienna: #c0622a;
      --terra:  #8b3e1a;
      --gold:   #d4a84b;
      --cream:  #f5eedf;
      --dusk:   #1a1410;
      --olive:  #6b7c4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--dusk);
      font-family: 'Inter', sans-serif;
      color: var(--cream); overflow: hidden;
    }
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(192,98,42,.4) 0%, transparent 70%),
        linear-gradient(170deg, #1a1410 0%, #0d0a07 60%, #111820 100%);
    }
    .app {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 44px) 16px env(safe-area-inset-bottom, 20px);
      gap: 10px;
      overflow: hidden;
    }

    /* HEADER */
    header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .wordmark { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 600; letter-spacing: .12em; color: var(--gold); }
    .wordmark span { display: block; font-size: 9px; font-weight: 400; letter-spacing: .25em; color: var(--sienna); }
    .gps-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px; padding: 7px 14px; font-size: 12px;
      color: rgba(245,238,223,.7); cursor: pointer;
    }
    .gps-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
    .gps-dot.active { background: #4caf50; animation: pulse 2s infinite; }
    .gps-dot.error  { background: var(--sienna); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* NOW PLAYING */
    .now-playing {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(212,168,75,.2);
      border-radius: 16px; padding: 16px; flex-shrink: 0;
    }
    .np-label { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: .3em; color: var(--gold); opacity: .7; margin-bottom: 8px; }
    .np-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; font-style: italic; color: var(--cream); margin-bottom: 4px; }
    .np-sub { font-size: 11px; color: rgba(245,238,223,.4); }
    .waveform { display: flex; align-items: center; gap: 3px; height: 30px; margin: 12px 0 10px; }
    .wb { flex: 1; border-radius: 2px; background: var(--gold); opacity: .25; height: 3px; }
    .waveform.playing .wb { opacity: .6; animation: wv 1.2s ease-in-out infinite; }
    @keyframes wv { 0%,100%{height:3px} 50%{height:var(--h,16px)} }
    .waveform.playing .wb:nth-child(1){--h:8px;animation-delay:0s}
    .waveform.playing .wb:nth-child(2){--h:20px;animation-delay:.1s}
    .waveform.playing .wb:nth-child(3){--h:14px;animation-delay:.2s}
    .waveform.playing .wb:nth-child(4){--h:24px;animation-delay:.05s}
    .waveform.playing .wb:nth-child(5){--h:10px;animation-delay:.15s}
    .waveform.playing .wb:nth-child(6){--h:20px;animation-delay:.3s}
    .waveform.playing .wb:nth-child(7){--h:16px;animation-delay:.08s}
    .waveform.playing .wb:nth-child(8){--h:26px;animation-delay:.22s}
    .waveform.playing .wb:nth-child(9){--h:12px;animation-delay:.18s}
    .waveform.playing .wb:nth-child(10){--h:8px;animation-delay:.35s}
    .transport { display: flex; align-items: center; justify-content: space-between; }
    .btn-play {
      width: 50px; height: 50px; border-radius: 50%;
      background: linear-gradient(135deg, var(--sienna), var(--terra));
      border: none; cursor: pointer; font-size: 18px; color: var(--cream);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(192,98,42,.4);
    }
    .btn-icon {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--cream); font-size: 15px;
    }
    .speed-btn {
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px; padding: 7px 12px; font-size: 12px;
      cursor: pointer; color: var(--cream);
    }

    /* SCRIPT TEXT */
    .script-box {
      flex: 0 0 120px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 14px; padding: 14px;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }
    .script-text { font-family: 'Cormorant Garamond', serif; font-size: 15px; line-height: 1.7; color: rgba(245,238,223,.75); }
    .script-empty { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-style: italic; color: rgba(245,238,223,.25); text-align: center; }
    .highlight { color: var(--gold); }

    /* SCRIPTS LIST */
    .queue-section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .queue-label {
      font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: .3em;
      color: rgba(212,168,75,.6); margin-bottom: 8px; flex-shrink: 0;
      display: flex; justify-content: space-between;
    }
    .add-btn { color: var(--sienna); cursor: pointer; }
    .queue-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 8px;
    }
    .queue-scroll::-webkit-scrollbar { display: none; }
    .queue-item {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px; padding: 12px 14px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
    }
    .queue-item.active { background: rgba(192,98,42,.18); border-color: rgba(212,168,75,.35); }
    .queue-item.played { opacity: .4; }
    .qi-icon { font-size: 18px; flex-shrink: 0; }
    .qi-info { flex: 1; }
    .qi-trigger { font-size: 10px; color: var(--sienna); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
    .qi-trigger.idle { color: var(--olive); }
    .qi-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--cream); }

    /* STATUS */
    .status-bar { font-size: 10px; color: rgba(245,238,223,.3); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .status-bar.loading { color: var(--gold); }
    .status-bar.ready   { color: var(--olive); }
    .status-bar.error   { color: var(--sienna); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: rgba(26,20,16,.95); border: 1px solid rgba(212,168,75,.2);
      border-radius: 20px; padding: 9px 18px; font-size: 13px;
      opacity: 0; transition: opacity .3s, transform .3s;
      pointer-events: none; white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.75); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      width: 100%; background: #1e1810;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(212,168,75,.2);
      padding: 20px 20px calc(env(safe-area-inset-bottom,16px) + 16px);
      transform: translateY(100%); transition: transform .3s;
      max-height: 85dvh; overflow-y: auto;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); margin: 0 auto 16px; }
    .modal h2 { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: .15em; color: var(--gold); margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 10px; letter-spacing: .12em; color: rgba(245,238,223,.4); text-transform: uppercase; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
      padding: 10px 12px; color: var(--cream);
      font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
    }
    .form-group textarea { min-height: 90px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-save {
      width: 100%; background: linear-gradient(135deg, var(--sienna), var(--terra));
      border: none; border-radius: 12px; padding: 13px;
      color: var(--cream); font-family: 'Cinzel', serif;
      font-size: 12px; letter-spacing: .1em; cursor: pointer; margin-top: 6px;
    }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="app">

  <header>
    <div class="wordmark">SICILIA<span>GUIDE AUDIO</span></div>
    <div class="gps-pill" onclick="toggleGPS()">
      <div class="gps-dot" id="gpsDot"></div>
      <span id="gpsLabel">GPS off</span>
    </div>
  </header>

  <div class="now-playing">
    <div class="np-label">EN COURS</div>
    <div class="np-title" id="npTitle">Sélectionner un script</div>
    <div class="np-sub" id="npSub">Choisissez un script ci-dessous</div>
    <div class="waveform" id="waveform">
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div>
    </div>
    <div class="transport">
      <button class="btn-icon" onclick="skipBack()">↩</button>
      <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶</button>
      <button class="btn-icon" onclick="skipNext()">↪</button>
      <button class="speed-btn" onclick="cycleSpeed()" id="speedBtn">1×</button>
    </div>
  </div>

  <div class="script-box">
    <div class="script-text" id="scriptText">
      <div class="script-empty">Le texte apparaîtra ici pendant la lecture…</div>
    </div>
  </div>

  <div class="queue-section">
    <div class="queue-label">
      <span>SCRIPTS</span>
      <span class="add-btn" onclick="openModal()">+ AJOUTER</span>
    </div>
    <div class="queue-scroll" id="queueScroll"></div>
  </div>

  <div class="status-bar" id="statusBar">
    <span>●</span><span id="statusText">Prêt</span>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>NOUVEAU SCRIPT</h2>
    <div class="form-group">
      <label>Titre</label>
      <input type="text" id="fTitle" placeholder="ex: Vallée des Temples" />
    </div>
    <div class="form-group">
      <label>Déclencheur</label>
      <select id="fType" onchange="updateFields()">
        <option value="gps">📍 GPS — proximité</option>
        <option value="idle">🕐 Temps mort</option>
        <option value="manual">👆 Manuel</option>
      </select>
    </div>
    <div id="gpsFields">
      <div class="form-row">
        <div class="form-group"><label>Latitude</label><input type="number" id="fLat" step="0.0001" placeholder="37.5079" /></div>
        <div class="form-group"><label>Longitude</label><input type="number" id="fLng" step="0.0001" placeholder="14.0154" /></div>
      </div>
      <div class="form-group"><label>Rayon (mètres)</label><input type="number" id="fRadius" value="200" /></div>
    </div>
    <div id="idleFields" style="display:none">
      <div class="form-group"><label>Silence minimum (sec)</label><input type="number" id="fIdle" value="120" /></div>
    </div>
    <div class="form-group">
      <label>Texte du script</label>
      <textarea id="fScript" placeholder="Texte lu à voix haute…"></textarea>
    </div>
    <button class="btn-save" onclick="saveScript()">Enregistrer</button>
  </div>
</div>

<script>
// ── DATA ──
const DEFAULT_SCRIPTS = [
  { id:'s1', title:'Vallée des Temples', played:false, priority:1,
    trigger:{ type:'gps', lat:37.2909, lng:13.5881, radius:300 },
    audio:'audio/test1.mp3'
    script:"Devant vous s'élèvent les temples doriques de la Vallée des Temples, inscrits au patrimoine mondial de l'UNESCO. Construits entre le sixième et le cinquième siècle avant notre ère, ils comptent parmi les exemples les mieux conservés de l'architecture grecque antique. Le Temple de la Concorde, encore presque intact, fut transformé en église chrétienne au septième siècle — ce qui explique sa remarquable préservation." },
  { id:'s2', title:'Palermo — Palais des Normands', played:false, priority:1,
    trigger:{ type:'gps', lat:38.1121, lng:13.3520, radius:250 },
    script:"Bienvenue au Palais des Normands. Construit sur une forteresse punique, puis arabe, ce palais fut la résidence des rois normands de Sicile au douzième siècle. La Chapelle Palatine, nichée en son cœur, est un chef-d'œuvre de l'art normand-arabe-byzantin : ses mosaïques dorées racontent l'histoire sacrée avec une beauté à couper le souffle." },
  { id:'s3', title:'Mont Etna — Approche', played:false, priority:2,
    trigger:{ type:'gps', lat:37.7510, lng:14.9934, radius:5000 },
    script:"Vous approchez de l'Etna — le plus grand volcan actif d'Europe. Avec ses trois mille trois cent vingt-neuf mètres, il domine toute la Sicile orientale. Les Siciliens l'appellent Mongibello, la belle montagne. La lave enrichit le sol agricole, permettant aux vignes et aux pistachiers de prospérer à ses pieds." },
  { id:'s4', title:'La cuisine sicilienne', played:false, priority:3,
    trigger:{ type:'idle', min_silence_sec:90 },
    script:"La cuisine sicilienne est un récit de toutes les civilisations qui ont occupé l'île. Les Arabes ont introduit le couscous, les amandes et la canne à sucre. Les Normands ont apporté la tradition du gibier. Les Espagnols, le chocolat et la tomate. Résultat : une cuisine unique où les arancini côtoient le caponata, et où la granita au café remplace le petit-déjeuner continental." },
  { id:'s5', title:'Taormine — Théâtre grec', played:false, priority:1,
    trigger:{ type:'gps', lat:37.8524, lng:15.2900, radius:200 },
    script:"Le Théâtre Antique de Taormine offre une des vues les plus spectaculaires du monde. Construit par les Grecs au troisième siècle avant notre ère, il pouvait accueillir jusqu'à cinq mille spectateurs. Depuis les gradins, par temps clair, vous distinguez l'Etna enneigé d'un côté, et la mer Ionienne de l'autre." }
];

let scripts = [];
try {
  const saved = localStorage.getItem('sicilia_scripts');
  scripts = saved ? JSON.parse(saved) : DEFAULT_SCRIPTS;
} catch(e) { scripts = DEFAULT_SCRIPTS; }

function saveScripts() {
  try { localStorage.setItem('sicilia_scripts', JSON.stringify(scripts)); } catch(e) {}
}

// ── STATE ──
let current = null, isPlaying = false, gpsActive = false;
let gpsWatchId = null, currentPos = null;
let idleTimer = null, idleSecs = 0;
let ttsReady = false, ttsLoading = false;
let utterance = null, speechSpeed = 1, speedIdx = 1;
const speeds = [0.8, 1, 1.1, 1.25];
let pipeline = null, audioCtx = null;

// ── RENDER ──
function renderQueue() {
  const el = document.getElementById('queueScroll');
  el.innerHTML = '';
  if (!scripts.length) {
    el.innerHTML = '<div style="color:rgba(245,238,223,.3);font-size:13px;padding:12px">Aucun script. Appuyez sur + AJOUTER.</div>';
    return;
  }
  scripts.forEach(s => {
    const div = document.createElement('div');
    div.className = 'queue-item' + (current?.id===s.id?' active':'') + (s.played?' played':'');
    const icon = s.trigger.type==='gps' ? '📍' : s.trigger.type==='idle' ? '🕐' : '👆';
    const trigLabel = s.trigger.type==='gps' ? 'GPS' : s.trigger.type==='idle' ? 'Temps mort' : 'Manuel';
    div.innerHTML = `<div class="qi-icon">${icon}</div>
      <div class="qi-info">
        <div class="qi-trigger ${s.trigger.type==='idle'?'idle':''}">${trigLabel}</div>
        <div class="qi-name">${s.title}</div>
      </div>`;
    div.onclick = () => selectScript(s.id);
    el.appendChild(div);
  });
}

function selectScript(id) {
  const s = scripts.find(x => x.id===id);
  if (!s) return;
  current = s;
  document.getElementById('npTitle').textContent = s.title;
  const sub = s.trigger.type==='gps' ? `GPS · rayon ${s.trigger.radius}m`
    : s.trigger.type==='idle' ? `Temps mort · ${s.trigger.min_silence_sec}s` : 'Manuel';
  document.getElementById('npSub').textContent = sub;
  document.getElementById('scriptText').innerHTML = s.script;
  if (isPlaying) { stopSpeech(); isPlaying=false; updateBtn(); }
  renderQueue();
}

// ── TTS ──
async function initTTS() {
  if (ttsLoading || ttsReady) return;
  ttsLoading = true;
  setStatus('loading', 'Chargement Kokoro…');
  try {
    const { pipeline: fn, env } = await import(
      'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1/dist/transformers.min.js'
    );
    env.allowLocalModels = false;
    setStatus('loading', 'Téléchargement modèle (~80 Mo, une seule fois)…');
    pipeline = await fn('text-to-speech', 'onnx-community/Kokoro-82M-v1.0', { dtype:'fp32', device:'wasm' });
    ttsReady = true; ttsLoading = false;
    setStatus('ready', 'Kokoro prêt ✓');
    showToast('🎙 Voix naturelle activée');
  } catch(e) {
    console.warn('Kokoro failed, using Web Speech', e);
    ttsLoading = false; ttsReady = 'fallback';
    setStatus('ready', 'Web Speech activé');
  }
}

async function speakText(text) {
  if (!ttsReady) await initTTS();
  stopSpeech();
  setWave(true);
  if (ttsReady===true && pipeline) await speakKokoro(text);
  else speakFallback(text);
}

async function speakKokoro(text) {
  try {
    const r = await pipeline(text, { voice:'fr_siwis' });
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==='suspended') await audioCtx.resume();
    const buf = audioCtx.createBuffer(1, r.audio.length, r.sampling_rate);
    buf.copyToChannel(r.audio, 0);
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.playbackRate.value = speechSpeed;
    src.connect(audioCtx.destination);
    src.onended = onEnded;
    utterance = src; src.start();
  } catch(e) { speakFallback(text); }
}

function speakFallback(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang='fr-FR'; u.rate=speechSpeed;
  u.onend = onEnded;
  utterance = u;
  speechSynthesis.speak(u);
}

function stopSpeech() {
  speechSynthesis.cancel();
  if (utterance?.stop) try { utterance.stop(); } catch(e) {}
  utterance = null; setWave(false);
}

function onEnded() {
  isPlaying=false; updateBtn(); setWave(false);
  if (current) { current.played=true; saveScripts(); renderQueue(); }
  resetIdle();
}

// ── CONTROLS ──
function togglePlay() {
  if (!current) { showToast('Sélectionnez un script'); return; }
  if (isPlaying) { pauseSpeech(); }
  else { startSpeech(); }
}

function startSpeech() {
  if (!current) return;
  initTTS();
  isPlaying=true; updateBtn();
  current.played=true; saveScripts(); renderQueue();
  speakText(current.script);
  resetIdle();
}

function pauseSpeech() {
  if (ttsReady===true) { if(utterance?.stop) try{utterance.stop()}catch(e){} }
  else speechSynthesis.pause();
  isPlaying=false; updateBtn(); setWave(false);
}

function skipBack() { stopSpeech(); isPlaying=false; updateBtn(); showToast('Rembobiné'); }

function skipNext() {
  stopSpeech();
  const next = scripts.find(s => !s.played && s.id!==current?.id);
  if (next) { selectScript(next.id); showToast('→ '+next.title); }
  else showToast('Fin de la file');
}

function cycleSpeed() {
  speedIdx=(speedIdx+1)%speeds.length;
  speechSpeed=speeds[speedIdx];
  document.getElementById('speedBtn').textContent=speechSpeed+'×';
  showToast('Vitesse : '+speechSpeed+'×');
}

function updateBtn() {
  document.getElementById('btnPlay').textContent = isPlaying ? '⏸' : '▶';
}
function setWave(on) { document.getElementById('waveform').classList.toggle('playing',on); }

// ── GPS ──
function toggleGPS() { gpsActive ? stopGPS() : startGPS(); }

function startGPS() {
  if (!navigator.geolocation) { showToast('GPS non disponible'); return; }
  gpsActive=true;
  document.getElementById('gpsDot').className='gps-dot active';
  document.getElementById('gpsLabel').textContent='GPS actif';
  gpsWatchId = navigator.geolocation.watchPosition(onPos, onGPSErr, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  resetIdle(); initTTS();
}

function stopGPS() {
  gpsActive=false;
  if (gpsWatchId!==null) navigator.geolocation.clearWatch(gpsWatchId);
  clearInterval(idleTimer);
  document.getElementById('gpsDot').className='gps-dot';
  document.getElementById('gpsLabel').textContent='GPS off';
}

function onPos(pos) {
  currentPos={ lat:pos.coords.latitude, lng:pos.coords.longitude };
  document.getElementById('gpsLabel').textContent='±'+Math.round(pos.coords.accuracy)+'m';
  checkGPS();
}
function onGPSErr() {
  document.getElementById('gpsDot').className='gps-dot error';
  document.getElementById('gpsLabel').textContent='Erreur GPS';
}

function haversine(a, b, c, d) {
  const R=6371000, r=Math.PI/180;
  const dL=(c-a)*r, dG=(d-b)*r;
  const x=Math.sin(dL/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function checkGPS() {
  if (!currentPos || isPlaying) return;
  const hit = scripts
    .filter(s=>s.trigger.type==='gps'&&!s.played)
    .filter(s=>haversine(currentPos.lat,currentPos.lng,s.trigger.lat,s.trigger.lng)<=s.trigger.radius)
    .sort((a,b)=>a.priority-b.priority)[0];
  if (hit) { selectScript(hit.id); showToast('📍 '+hit.title); startSpeech(); }
}

// ── IDLE ──
function resetIdle() {
  clearInterval(idleTimer); idleSecs=0;
  idleTimer = setInterval(()=>{
    if (isPlaying) { idleSecs=0; return; }
    idleSecs++;
    const hit = scripts.filter(s=>s.trigger.type==='idle'&&!s.played)
      .find(s=>idleSecs>=s.trigger.min_silence_sec);
    if (hit) { selectScript(hit.id); showToast('🕐 Contenu de remplissage'); startSpeech(); }
  }, 1000);
}

// ── MODAL ──
function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeBg(e) { if(e.target===document.getElementById('modalOverlay')) closeModal(); }
function updateFields() {
  const t=document.getElementById('fType').value;
  document.getElementById('gpsFields').style.display=t==='gps'?'':'none';
  document.getElementById('idleFields').style.display=t==='idle'?'':'none';
}
function saveScript() {
  const title=document.getElementById('fTitle').value.trim();
  const script=document.getElementById('fScript').value.trim();
  const type=document.getElementById('fType').value;
  if (!title||!script) { showToast('Titre et script requis'); return; }
  const s = { id:'s'+Date.now(), title, script, played:false, priority:3,
    trigger: type==='gps' ? { type:'gps',
      lat:parseFloat(document.getElementById('fLat').value),
      lng:parseFloat(document.getElementById('fLng').value),
      radius:parseInt(document.getElementById('fRadius').value)||200
    } : type==='idle' ? { type:'idle', min_silence_sec:parseInt(document.getElementById('fIdle').value)||120 }
    : { type:'manual' }
  };
  scripts.push(s); saveScripts(); renderQueue(); closeModal();
  showToast('Script ajouté ✓');
  document.getElementById('fTitle').value='';
  document.getElementById('fScript').value='';
}

// ── HELPERS ──
function setStatus(state,text) {
  document.getElementById('statusBar').className='status-bar '+state;
  document.getElementById('statusText').textContent=text;
}
let toastT;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2500);
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', ()=>{
  renderQueue();
  document.addEventListener('touchstart', ()=>{ if(!ttsReady&&!ttsLoading) initTTS(); }, {once:true});
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
